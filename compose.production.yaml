services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Defina POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-mvsystem}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      {
        test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"],
        interval: 10s,
        timeout: 5s,
        retries: 5,
      }
  api:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-mvsystem}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:?Defina CORS_ORIGINS}
      FISCAL_MODE: ${FISCAL_MODE:-disabled}
    depends_on: { db: { condition: service_healthy } }
    command: ["sh", "-c", "npx prisma migrate deploy && node dist/index.js"]
  web:
    build: { context: ./frontend, args: { VITE_API_URL: /api } }
    restart: unless-stopped
    ports: ["127.0.0.1:8080:80"]
    depends_on: [api]
volumes: { postgres_data: {} }
